<div id="app"><div id="bar"><button id="menuBtn">☰ Games</button><div id="title">KIOSK ARCADE</div><div id="stats"><small>SCORE</small><span id="score">0</span></div></div><div id="screen"></div></div>

function g2048(){screen.innerHTML='<div class=panel><div class=sub>Swipe the board</div><div id=n2048></div><div class=controls><button class=up>↑</button><button class=left>←</button><button class=down>↓</button><button class=right>→</button></div></div>';let a=Array(16).fill(0),touch;function add(){let e=a.map((v,i)=>v?null:i).filter(x=>x!==null);if(e.length)a[R(e)]=Math.random()<.9?2:4}function draw(){let n=$("n2048");n.innerHTML="";a.forEach(v=>{let d=document.createElement("div");d.className="tile";d.textContent=v||"";if(v)d.style.background=C[(Math.log2(v)-1)%C.length];n.appendChild(d)})}function mv(d){let old=a.join(),out=[];for(let k=0;k<4;k++){let row=d=="up"||d=="down"?a.filter((_,i)=>i%4==k):a.slice(k*4,k*4+4);if(d=="right"||d=="down")row.reverse();row=row.filter(Boolean);for(let i=0;i<row.length-1;i++)if(row[i]==row[i+1]){row[i]*=2;setS(score+row[i]);row.splice(i+1,1)}while(row.length<4)row.push(0);if(d=="right"||d=="down")row.reverse();out.push(...row)}a=d=="up"||d=="down"?Array.from({length:16},(_,i)=>out[(i%4)*4+Math.floor(i/4)]):out;if(a.join()!=old){add();draw()}}document.querySelectorAll(".controls button").forEach(b=>b.onclick=()=>mv(b.className));$("n2048").onpointerdown=e=>touch=[e.clientX,e.clientY];$("n2048").onpointerup=e=>{if(touch){let x=e.clientX-touch[0],y=e.clientY-touch[1];if(Math.max(Math.abs(x),Math.abs(y))>25)mv(Math.abs(x)>Math.abs(y)?x>0?"right":"left":y>0?"down":"up");touch=null}};add();add();draw()}
function gWhack(){screen.innerHTML='<div class=panel><div id=wt class=sub>30 seconds</div><div id=whack></div><button class=primary id=ws>Start</button></div>';for(let i=0;i<9;i++){let b=document.createElement("button");b.className="hole";b.onclick=()=>{if(b.textContent){setS(score+10);b.textContent="";pop("+10")}};$("whack").appendChild(b)}$("ws").onclick=()=>{let t=30;$("ws").disabled=true;timer=setInterval(()=>{t--;$("wt").textContent=t+" seconds";if(t<=0)stop()},1000);let m=setInterval(()=>{if(t<=0){clearInterval(m);$("ws").disabled=false;return}$("whack").querySelectorAll(".hole").forEach(x=>x.textContent="");$("whack").children[Math.floor(Math.random()*9)].textContent="🐹"},600)}}

function gMemory(){screen.innerHTML='<div class=panel><div class=sub>Find matching pairs</div><div id=memory></div></div>';let d=["🍎","🍌","🍒","🍋","🍇","🍉","🥝","🍓"].flatMap(x=>[x,x]).sort(()=>Math.random()-.5),open=[];d.forEach((v,i)=>{let b=document.createElement("button");b.className="mem";b.textContent=v;b.onclick=()=>{if(open.length==2||b.classList.contains("done")||b.classList.contains("open"))return;b.classList.add("open");open.push(i);if(open.length==2){let [x,y]=open;if(d[x]==d[y]){$("memory").children[x].classList.add("done");$("memory").children[y].classList.add("done");setS(score+100);open=[];pop("+100")}else setTimeout(()=>{open.forEach(j=>$("memory").children[j].classList.remove("open"));open=[]},500)}};$("memory").appendChild(b)})}

function gSnake(){screen.innerHTML='<div class=panel><div class=sub>Use the arrows</div><div id=snake></div><div class=controls><button class=up>↑</button><button class=left>←</button><button class=down>↓</button><button class=right>→</button></div></div>';let n=12,s=[{x:6,y:6}],d={x:1,y:0},nd=d,f={x:2,y:2},alive=1;for(let i=0;i<144;i++){let c=document.createElement("div");c.className="sc";$("snake").appendChild(c)}function sd(x){if(x.x+d.x||x.y+d.y)nd=x}document.querySelector(".up").onclick=()=>sd({x:0,y:-1});document.querySelector(".down").onclick=()=>sd({x:0,y:1});document.querySelector(".left").onclick=()=>sd({x:-1,y:0});document.querySelector(".right").onclick=()=>sd({x:1,y:0});function dr(){document.querySelectorAll(".sc").forEach(x=>x.className="sc");s.forEach(p=>$("snake").children[p.y*n+p.x].className="sc sn");$("snake").children[f.y*n+f.x].className="sc fd"}timer=setInterval(()=>{if(!alive)return;d=nd;let h={x:s[0].x+d.x,y:s[0].y+d.y};if(h.x<0||h.x>=n||h.y<0||h.y>=n||s.some(p=>p.x==h.x&&p.y==h.y)){alive=0;stop();pop("GAME OVER",1);return}s.unshift(h);if(h.x==f.x&&h.y==f.y){setS(score+25);do f={x:Math.floor(Math.random()*n),y:Math.floor(Math.random()*n)}while(s.some(p=>p.x==f.x&&p.y==f.y))}else s.pop();dr()},130);dr()}
